# 月度题材适配清单
# 用于轮动策略，根据当前月份自动应用题材权重

themes:
  - month: 1
    name: "春节消费"
    keywords: ["消费", "白酒", "旅游", "餐饮", "零售"]
    commodity_signals:
      - commodity: "AU"  # 黄金
        weight: 0.3
        related_stocks: ["600519", "000858", "600809"]  # 茅台、五粮液、山西汾酒
      - commodity: "CU"  # 铜（消费电子）
        weight: 0.2
        related_stocks: ["002415", "000063"]  # 海康威视、中兴通讯
    
  - month: 2
    name: "春季开工"
    keywords: ["基建", "建材", "钢铁", "水泥", "工程机械"]
    commodity_signals:
      - commodity: "RB"  # 螺纹钢
        weight: 0.4
        related_stocks: ["000709", "600019", "000825"]  # 河钢股份、宝钢股份、太钢不锈
      - commodity: "CU"  # 铜
        weight: 0.3
        related_stocks: ["000831", "600362", "600111"]  # 中国稀土、江西铜业、北方稀土
      - commodity: "AL"  # 铝
        weight: 0.2
        related_stocks: ["000612", "600219"]  # 焦作万方、南山铝业
  
  - month: 3
