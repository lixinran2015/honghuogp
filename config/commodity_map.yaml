# 商品价格检查配置
price_check_config:
  lookback_days: 20  # 回看天数
  thresholds:
    weak_signal: 0.15    # 15% - 弱信号
    medium_signal: 0.25  # 25% - 中等信号
    strong_signal: 0.40  # 40% - 强信号
  score_bonus:
    weak: 5      # 弱信号加分
    medium: 10   # 中等信号加分
    strong: 20   # 强信号加分
  priority_queue_threshold: 80  # 优先队列阈值

